name: Build Overlay

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-client.txt

      - name: Install client dependencies
        run: python -m pip install -r requirements-client.txt

      - name: Build overlay exe
        run: python build_exe.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDungeonTracker
          path: dist/MirrorDungeonTracker.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MirrorDungeonTracker.zip
          generate_release_notes: true
